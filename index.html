<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyPatch — Territory Journey Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0F1923; color: #e2e8f0; font-family: Segoe UI, system-ui, sans-serif; }
    #root { min-height: 100vh; }
    #loading {
      position: fixed; inset: 0; background: #0F1923;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; z-index: 9999;
    }
    #loading .spinner {
      width: 40px; height: 40px; border: 3px solid #1e293b;
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: #64748b; }
    #loading h2 { font-size: 20px; font-weight: 800; color: #e2e8f0; }
    #error {
      display: none; position: fixed; inset: 0; background: #0F1923;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    }
    #error h2 { color: #f87171; font-size: 18px; }
    #error p { color: #64748b; font-size: 13px; max-width: 400px; text-align: center; }
    #error button { background: #0369a1; color: #e0f2fe; border: none; border-radius: 7px; padding: 10px 20px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loading">
    <span style="font-size:40px">🗺</span>
    <h2>MyPatch</h2>
    <div class="spinner"></div>
    <p>Loading Territory Journey Planner...</p>
  </div>
  <div id="error">
    <span style="font-size:40px">⚠️</span>
    <h2>Something went wrong</h2>
    <p>Please try refreshing the page. If the problem continues, try opening in Chrome or Safari.</p>
    <button onclick="location.reload()">Refresh</button>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script>
    // Hide loading screen once app mounts, show error if it fails
    window.__appMounted = function() {
      var el = document.getElementById("loading");
      if (el) el.style.display = "none";
    };
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "flex";
      console.error("App error:", msg, err);
    };
    // Fallback: if not mounted after 15s, show error
    setTimeout(function() {
      var loading = document.getElementById("loading");
      if (loading && loading.style.display !== "none") {
        loading.style.display = "none";
        document.getElementById("error").style.display = "flex";
      }
    }, 15000);
  </script>

  <script type="text/babel" data-presets="react">
const { useState, useRef } = React;

// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const MONTH_NAMES = ["january","february","march","april","may","june","july","august","september","october","november","december"];

const TC = {

  B:{bg:"#1e3a5f",text:"#60a5fa",border:"#2563eb"},
  C:{bg:"#4a2c0a",text:"#fb923c",border:"#ea580c"},

// Major TFL transport hubs with coords — used for soft landing scoring
const TRANSPORT_HUBS = [

const PC_COORDS = {

  "EN4":[51.6474,-0.1596],"EN5":[51.6478,-0.1869],"EN6":[51.7025,-0.1833],
  "EN7":[51.6956,-0.0613],"EN8":[51.7078,-0.0274],"EN9":[51.7300,-0.0097],
  "EN10":[51.7450,-0.0149],"EN11":[51.7615,-0.0040],
  "N1":[51.5362,-0.1026],"N2":[51.5876,-0.1644],"N3":[51.5980,-0.1927],
  "N4":[51.5708,-0.1034],"N5":[51.5554,-0.0993],"N6":[51.5678,-0.1494],
  "N7":[51.5502,-0.1174],"N8":[51.5870,-0.1181],"N9":[51.6247,-0.0573],
  "N10":[51.5934,-0.1430],"N11":[51.6101,-0.1538],"N12":[51.6094,-0.1763],
  "N13":[51.6264,-0.1023],"N14":[51.6375,-0.1068],"N15":[51.5832,-0.0726],

  "N22":[51.6001,-0.1107],
  "NW1":[51.5336,-0.1452],"NW2":[51.5582,-0.2190],"NW3":[51.5541,-0.1683],
  "NW4":[51.5896,-0.2136],"NW5":[51.5537,-0.1401],"NW6":[51.5432,-0.1926],
  "NW7":[51.6158,-0.2266],"NW8":[51.5306,-0.1709],"NW9":[51.5927,-0.2587],

  "W5":[51.5140,-0.3006],"W8":[51.5014,-0.1963],"W9":[51.5225,-0.1836],
  "W10":[51.5203,-0.2175],"W11":[51.5138,-0.2067],
  "SW1":[51.5009,-0.1353],"SW11":[51.4628,-0.1659],
  "HP":[51.8168,-0.8093],
};

const EXAMPLE_STORES = [
  "WIS102:PET104 | Petter Pharmacy | N8 8DT | A",
  "AMY101 | Amy Pharmacy | N8 8SY | B",
  "REE102 | Reena Pharmacy | N8 8AA | B",

  "HAE101 | Haelan Centre | N8 8DT | A",

  "MUS101 | Muswell Hill Pharmacy | N10 3HN | B",
  "DUK101 | Dukes Pharmacy | N10 1DJ | B",
  "AND105 | C W Andrew | N2 9PJ | A",
  "OAK101 | Oakdale Pharmacy | N2 8AQ | B",
  "NUC105 | Nuchem Pharmaceuticals | N4 3PZ | A",
  "MED131 | Med-Chem Pharmacy | N4 1DU | A",
  "PAR119 | Parade Chemist | N4 1LG | B",
  "OLI107 | Olive and Green | N16 5HT | A",
  "FOO110 | Food For All | N16 6PA | B",
  "HAR198 | Harvest N16 | N16 7JL | B",
  "CLA108 | Clan Pharmacy | N1 1RA | A",
  "WHO117:WHO129 | Whole Foods Angel | N1 0PD | A",
  "JOH101 | St Johns Wood Pharmacy | NW8 7SE | A",
  "LAN103 | Landys Chemist | NW11 0AA | A",
  "PLA106:PLA130 | Planet Organic Hampstead | NW3 1PR | A",
  "RIT103 | Ritz Pharmacy | NW3 6UA | A",
  "HYP101 | Hyperchem Pharmacy | NW6 6NL | A",
  "CAL123 | Caledonian Pharmacy | N7 9RP | A",
  "EAR108 | Earth Natural Foods | NW5 2AE | A",
  "WHO117:WHO120 | Whole Foods Camden | NW1 7PN | A",
  "NAP101:WAR108 | Warwick Pharmacy | N11 2EU | A",

// ─────────────────────────────────────────────────────────────────────────────
// GEO HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function getCoords(postcode) {
  var d = (postcode || "").trim().toUpperCase().split(" ")[0];
  return PC_COORDS[d] || PC_COORDS[d.replace(/\d+$/, "")] || [51.5074, -0.1278];
}
function getDistrict(postcode) {
  return (postcode || "").trim().toUpperCase().split(" ")[0];
}
function distKm(lat1, lng1, lat2, lng2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLng = (lng2 - lng1) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function estimateMins(lat1, lng1, lat2, lng2) {
  var km = distKm(lat1, lng1, lat2, lng2);
  return km < 0.6 ? Math.round(km * 12) : Math.round(10 + km * 3.5);
}
function travelMode(lat1, lng1, lat2, lng2) {
  var km = distKm(lat1, lng1, lat2, lng2);
  return km < 0.6 ? "🚶 Walk" : km < 2.5 ? "🚌 Bus" : "🚇 Tube/Bus";
}
function fmtTime(m) {
  return String(Math.floor(m / 60)).padStart(2,"0") + ":" + String(m % 60).padStart(2,"0");
}

// Zones further than this from home are treated as "drive zones" — visited first by car,
// then the rep returns home before continuing on public transport
var DRIVE_ZONE_KM = 25;

function isDriveStore(postcode, hLat, hLng) {
  var c = getCoords(postcode);
  return distKm(hLat, hLng, c[0], c[1]) > DRIVE_ZONE_KM;
}

// Drive time estimate: ~50km/h average inc traffic lights
function driveTimeMins(lat1, lng1, lat2, lng2) {
  var km = distKm(lat1, lng1, lat2, lng2);
  return Math.round(km / 50 * 60);
}

// Score how close a location is to the nearest transport hub
function hubScore(lat, lng) {
  var best = Infinity;
  for (var i = 0; i < TRANSPORT_HUBS.length; i++) {
    var d = distKm(lat, lng, TRANSPORT_HUBS[i][0], TRANSPORT_HUBS[i][1]);
    if (d < best) best = d;
  }
  return best; // lower = better (closer to a hub)
}

// ─────────────────────────────────────────────────────────────────────────────
// CALENDAR
// ─────────────────────────────────────────────────────────────────────────────
function parseMonthString(text) {
  var t = (text || "").trim().toLowerCase();
  for (var i = 0; i < MONTH_NAMES.length; i++) {
    if (t.indexOf(MONTH_NAMES[i].slice(0,3)) >= 0) {
      var ym = t.match(/\d{4}/);
      return { year: ym ? parseInt(ym[0]) : new Date().getFullYear(), month: i };
    }
  }
  var m = t.match(/^(\d{1,2})[\/\-](\d{4})$/);
  if (m) return { year: parseInt(m[2]), month: parseInt(m[1])-1 };
  m = t.match(/^(\d{4})[\/\-](\d{1,2})$/);
  if (m) return { year: parseInt(m[1]), month: parseInt(m[2])-1 };
  return null;
}

function buildCalendarWeeks(year, month) {
  var days = [], d = new Date(year, month, 1), last = new Date(year, month+1, 0);
  while (d <= last) {
    var dow = d.getDay();
    if (dow >= 1 && dow <= 5) {
      days.push({
        date: new Date(d),
        dayName: DAYS[dow-1],
        label: DAYS[dow-1] + " " + d.getDate() + "/" + (month+1),
        dateKey: d.toISOString().slice(0,10),
      });
    }
    d.setDate(d.getDate() + 1);
  }
  var weeks = [], cur = [];
  for (var i = 0; i < days.length; i++) {
    if (days[i].dayName === "Monday" && cur.length > 0) { weeks.push(cur); cur = []; }
    cur.push(days[i]);
  }
  if (cur.length) weeks.push(cur);
  return weeks;
}

// ─────────────────────────────────────────────────────────────────────────────
// TIER ROTATION
// A = every month (all A stores each month)
// B = every 6 weeks (~2 visits per quarter) — alternate halves by month parity
// C = every 2 months — alternate halves by month parity
// ─────────────────────────────────────────────────────────────────────────────
function filterByRotation(stores, monthIndex) {
  // A + B: always included every month — no rotation
  // C: rotate in halves every 2 months
  // D: rotate in halves every 2 months (same as C)
  var result = [];
  for (var i = 0; i < stores.length; i++) {
    var s = stores[i];
    if (s.tier === "A" || s.tier === "B") {
      // A and B stores are always included — no rotation
      result.push(s);
    } else if (s.tier === "C" || s.tier === "D") {
      // C and D rotate in halves every 2 months
      var halfIdx = i % 2;
      var monthParity = monthIndex % 2;
      if (halfIdx === monthParity) result.push(s);
      else result.push(Object.assign({}, s, { _skipped: true }));
    } else {
      result.push(s);
    }
  }
  return result.filter(function(s) { return !s._skipped; });
}

// ─────────────────────────────────────────────────────────────────────────────
// CORE ROUTING — ZONE-COMMITTED, ARC-BACK, SOFT LANDING
// ─────────────────────────────────────────────────────────────────────────────
// Natural travel corridors — districts that form a logical arc on the same bus/tube line.
// Stores within a corridor are treated as one zone so the day stays tight.
var CORRIDORS = [
  ["EN10","EN9","EN8","EN7"],           // Lea Valley line north
  ["EN3","EN1","N18","N9"],             // Lea Valley / Edmonton south
  ["EN5","EN4","N20","N12"],            // Barnet / Whetstone / Friern Barnet
  ["N22","N10","N8"],                   // Wood Green / Muswell Hill / Hornsey
  ["N13","N11","N21"],                  // Palmers Green / Bounds Green / Winchmore Hill
  ["N14","N21","EN1"],                  // Southgate / Winchmore Hill / Enfield
  ["N3","NW11","NW4","NW2"],            // Finchley / Golders Green / Hendon
  ["N2","N10","N3"],                    // East Finchley / Muswell Hill / Finchley
  ["N4","N19","NW5"],                   // Finsbury Park / Archway / Kentish Town
  ["N7","N1"],                          // Holloway / Islington
  ["NW1","W1G","W1"],                   // Marylebone / Camden
  ["NW8","W9","W2"],                    // St John's Wood / Maida Vale / Paddington
  ["W11","W10","NW6"],                  // Notting Hill / Ladbroke Grove / Kilburn
  ["W4","W5"],                          // Chiswick / Ealing
  ["NW3","NW6"],                        // Hampstead / Kilburn
];

// Returns the corridor key for a district (first matching corridor, else the district itself)
function corridorKey(district) {
  for (var i = 0; i < CORRIDORS.length; i++) {
    if (CORRIDORS[i].indexOf(district) >= 0) return CORRIDORS[i][0]; // use first district as key
  }
  return district;
}

function groupByDistrict(stores) {
  // Group first by corridor, then by individual district within each corridor.
  // This keeps stores on the same travel line together without forcing unrelated districts.
  var g = {};
  for (var i = 0; i < stores.length; i++) {
    var d = getDistrict(stores[i].postcode);
    var ck = corridorKey(d);
    if (!g[ck]) g[ck] = [];
    g[ck].push(stores[i]);
  }

  // Split any corridor group that spans more than ~4km into sub-groups
  // so we don't create days that are too geographically spread
  var result = [];
  var keys = Object.keys(g);
  for (var k = 0; k < keys.length; k++) {
    var group = g[keys[k]];
    if (group.length <= 1) { result.push(group); continue; }

    // Check span of this corridor group
    var cen = zoneCentroid(group);
    var maxDist = 0;
    for (var m = 0; m < group.length; m++) {
      var c = getCoords(group[m].postcode);
      var dd = distKm(cen[0], cen[1], c[0], c[1]);
      if (dd > maxDist) maxDist = dd;
    }

    if (maxDist > 4.5) {
      // Too spread — split back into individual districts
      var subg = {};
      for (var s = 0; s < group.length; s++) {
        var sd = getDistrict(group[s].postcode);
        if (!subg[sd]) subg[sd] = [];
        subg[sd].push(group[s]);
      }
      Object.values(subg).forEach(function(sg) { result.push(sg); });
    } else {
      result.push(group);
    }
  }
  return result;
}

function groupByRadius(stores, radiusKm) {
  var assigned = new Array(stores.length).fill(-1);
  var clusters = [];
  for (var i = 0; i < stores.length; i++) {
    if (assigned[i] >= 0) continue;
    var ci = clusters.length;
    clusters.push([i]);
    assigned[i] = ci;
    var c1 = getCoords(stores[i].postcode);
    for (var j = i+1; j < stores.length; j++) {
      if (assigned[j] >= 0) continue;
      var c2 = getCoords(stores[j].postcode);
      if (distKm(c1[0],c1[1],c2[0],c2[1]) <= radiusKm) { clusters[ci].push(j); assigned[j] = ci; }
    }
  }
  return clusters.map(function(idx) { return idx.map(function(i) { return stores[i]; }); });
}

function zoneCentroid(zone) {
  var lats = zone.map(function(s) { return getCoords(s.postcode)[0]; });
  var lngs = zone.map(function(s) { return getCoords(s.postcode)[1]; });
  var n = lats.length;
  return [lats.reduce(function(a,b){return a+b;},0)/n, lngs.reduce(function(a,b){return a+b;},0)/n];
}

// Sequence stores within a zone: furthest first, arc back home, last stop near a hub
function sequenceZone(stores, hLat, hLng) {
  if (!stores.length) return [];
  if (stores.length === 1) return stores.slice();

  // Find furthest store from home — that's stop 1
  var fi = 0, fd = 0;
  for (var i = 0; i < stores.length; i++) {
    var c = getCoords(stores[i].postcode);
    var d = distKm(hLat, hLng, c[0], c[1]);
    if (d > fd) { fd = d; fi = i; }
  }

  var remaining = stores.slice();
  var first = remaining.splice(fi, 1)[0];
  var result = [first];
  var cc = getCoords(first.postcode);
  var curLat = cc[0], curLng = cc[1];

  // For intermediate stops: score by (distance to next) + homeward bias
  // For the final stop: add hub proximity bonus so we finish near transport
  while (remaining.length > 0) {
    var isLast = remaining.length === 1;
    var bestIdx = 0, bestScore = Infinity;
    for (var j = 0; j < remaining.length; j++) {
      var rc = getCoords(remaining[j].postcode);
      var distToNext = distKm(curLat, curLng, rc[0], rc[1]);
      var distToHome = distKm(rc[0], rc[1], hLat, hLng);
      var hub = isLast ? hubScore(rc[0], rc[1]) * 0.8 : 0; // soft landing bonus on final stop
      var score = distToNext + distToHome * 0.35 + hub;
      if (score < bestScore) { bestScore = score; bestIdx = j; }
    }
    result.push(remaining[bestIdx]);
    var nc = getCoords(remaining[bestIdx].postcode);
    curLat = nc[0]; curLng = nc[1];
    remaining.splice(bestIdx, 1);
  }
  return result;
}

// Build the full ordered pool:
// 1. Group into zones (district or radius)
// 2. Order zones: furthest from home first, then chain nearest-centroid back
// 3. Sequence within each zone: furthest-first arc with soft landing on last stop
function buildPool(stores, hLat, hLng, mode, radiusKm) {
  if (!stores.length) return [];
  var zones = mode === "district" ? groupByDistrict(stores) : groupByRadius(stores, radiusKm);
  if (!zones.length) return [];

  // Start at the furthest zone
  var fi = 0, fd = 0;
  for (var i = 0; i < zones.length; i++) {
    var cen = zoneCentroid(zones[i]);
    var d = distKm(hLat, hLng, cen[0], cen[1]);
    if (d > fd) { fd = d; fi = i; }
  }

  // Chain remaining zones: nearest centroid with homeward bias (loop back)
  // Priority: pick the next zone that is (a) geographically close to current position
  // AND (b) on the arc back toward home. Never jump to a zone that breaks the arc.
  var visited = new Array(zones.length).fill(false);
  var ordered = [];
  visited[fi] = true;
  ordered.push(zones[fi]);
  var lc = zoneCentroid(zones[fi]);
  var curLat = lc[0], curLng = lc[1];
  // Track distance to home from start of chain — we should be getting closer each step
  var startDistToHome = distKm(lc[0], lc[1], hLat, hLng);

  while (ordered.length < zones.length) {
    var bi = -1, bs = Infinity;
    var curDistToHome = distKm(curLat, curLng, hLat, hLng);
    for (var j = 0; j < zones.length; j++) {
      if (visited[j]) continue;
      var zc = zoneCentroid(zones[j]);
      var distToZone = distKm(curLat, curLng, zc[0], zc[1]);
      var distToHome = distKm(zc[0], zc[1], hLat, hLng);
      // Arc-back bias: strongly prefer zones that are closer to home than current position
      // This enforces the "furthest first, arc back" principle at the zone level
      var arcBonus = distToHome < curDistToHome ? 0 : distToHome * 0.6;
      var score = distToZone + arcBonus;
      if (score < bs) { bs = score; bi = j; }
    }
    if (bi < 0) break;
    visited[bi] = true;
    ordered.push(zones[bi]);
    var nc = zoneCentroid(zones[bi]);
    curLat = nc[0]; curLng = nc[1];
  }

  // Flatten: sequence each zone internally
  var pool = [];
  for (var k = 0; k < ordered.length; k++) {
    var seq = sequenceZone(ordered[k], hLat, hLng);
    for (var s = 0; s < seq.length; s++) pool.push(seq[s]);
  }
  return pool;
}

function buildTimetable(stores, visitMins, hLat, hLng) {
  // Split stores into drive leg (far stores, >25km) and transit leg (close stores)
  var driveStores = stores.filter(function(s) { return isDriveStore(s.postcode, hLat, hLng); });
  var transitStores = stores.filter(function(s) { return !isDriveStore(s.postcode, hLat, hLng); });
  var hasDriveLeg = driveStores.length > 0;

  var slots = [];
  var mins = 7 * 60 + 30; // Drive leg starts 07:30

  // ── DRIVE LEG ─────────────────────────────────────────────────────────────
  if (hasDriveLeg) {
    var pLat = hLat, pLng = hLng;
    // Sequence drive stores furthest first
    var driveSeq = sequenceZone(driveStores, hLat, hLng);
    for (var i = 0; i < driveSeq.length; i++) {
      var s = driveSeq[i];
      var c = getCoords(s.postcode);
      var tm = driveTimeMins(pLat, pLng, c[0], c[1]);
      mins += tm;
      var arr = fmtTime(mins);
      mins += visitMins;
      slots.push(Object.assign({}, s, {
        arriveTime: arr, leaveTime: fmtTime(mins),
        travelMins: tm, travelMode: "🚗 Drive", isDriveLeg: true,
      }));
      pLat = c[0]; pLng = c[1];
    }
    // Drive back home
    var returnDrive = driveTimeMins(pLat, pLng, hLat, hLng);
    mins += returnDrive + 15; // +15 min buffer to park/freshen up
    // Mark the return-home point in the first transit slot's pre-travel
  }

  // ── TRANSIT LEG ───────────────────────────────────────────────────────────
  if (!hasDriveLeg) mins = 9 * 60; // normal start if no drive leg
  var tLat = hLat, tLng = hLng;
  var transitSeq = transitStores.length > 0 ? sequenceZone(transitStores, hLat, hLng) : [];
  for (var j = 0; j < transitSeq.length; j++) {
    var ts = transitSeq[j];
    var tc = getCoords(ts.postcode);
    var ttm = estimateMins(tLat, tLng, tc[0], tc[1]);
    var tmode = travelMode(tLat, tLng, tc[0], tc[1]);
    mins += ttm;
    var tarr = fmtTime(mins);
    mins += visitMins;
    slots.push(Object.assign({}, ts, {
      arriveTime: tarr, leaveTime: fmtTime(mins),
      travelMins: ttm, travelMode: tmode, isDriveLeg: false,
      isFirstTransit: j === 0 && hasDriveLeg, // flag to show "return home then depart again"
    }));
    tLat = tc[0]; tLng = tc[1];
  }

  var backTime = fmtTime(mins + estimateMins(tLat, tLng, hLat, hLng));
  return { slots: slots, backTime: backTime, hasDriveLeg: hasDriveLeg };
}

// Build the full month plan
// Key principle: allocate whole zones to days so no pinballing
function buildMonthPlan(stores, perDay, visitMins, hLat, hLng, mode, radiusKm, calendarWeeks, blockedDates, monthIndex, storeAvailability) {
  var blocked = {};
  for (var b = 0; b < blockedDates.length; b++) blocked[blockedDates[b]] = true;

  // Apply tier rotation first
  var rotated = filterByRotation(stores, monthIndex);

  // Dedupe again as safety net — catches any compound-code duplicates
  var dedupedRotated = dedupeStores(rotated);

  // Build full ordered pool with zone-committed routing
  var rawPool = buildPool(dedupedRotated, hLat, hLng, mode, radiusKm);

  // Final dedupe of the pool itself by store id — prevents any store appearing twice
  var seenIds = {};
  var orderedPool = [];
  for (var pi = 0; pi < rawPool.length; pi++) {
    if (!seenIds[rawPool[pi].id]) {
      seenIds[rawPool[pi].id] = true;
      orderedPool.push(rawPool[pi]);
    }
  }

  var plan = [];
  var poolIdx = 0;

  for (var w = 0; w < calendarWeeks.length; w++) {
    var weekDays = [];
    for (var d = 0; d < calendarWeeks[w].length; d++) {
      var di = calendarWeeks[w][d];
      if (blocked[di.dateKey]) {
        weekDays.push({ dayName: di.dayName, dateLabel: di.label, dateKey: di.dateKey, slots: [], backTime: "", blocked: true });
        continue;
      }
      // Take this day's stores from the pool — these are already zone-ordered
      // Build this day's pool respecting store availability restrictions
      // First pass: collect stores available on this day
      var sa = storeAvailability || {};
      var available = [], deferred = [];
      var searchFrom = poolIdx * perDay;
      // Collect perDay stores from the pool that are available on this day
      var dayStores = [];
      var scanIdx = searchFrom;
      while (dayStores.length < perDay && scanIdx < orderedPool.length) {
        var candidate = orderedPool[scanIdx];
        var avail = sa[candidate.id] ? sa[candidate.id].availDays || [] : [];
        var okDay = avail.length === 0 || avail.indexOf(di.dayName) >= 0;
        if (okDay) dayStores.push(candidate);
        scanIdx++;
      }
      // If we couldn't fill the day from available stores, top up from the next slots anyway
      if (dayStores.length < perDay) {
        var dayPool = orderedPool.slice(poolIdx * perDay, (poolIdx + 1) * perDay);
        // merge without duplicates
        for (var si = 0; si < dayPool.length; si++) {
          var alreadyIn = false;
          for (var sj = 0; sj < dayStores.length; sj++) { if (dayStores[sj].id === dayPool[si].id) { alreadyIn = true; break; } }
          if (!alreadyIn) dayStores.push(dayPool[si]);
          if (dayStores.length >= perDay) break;
        }
      }
      var optimised = dayStores.length > 0 ? sequenceZone(dayStores, hLat, hLng) : [];
      var result = buildTimetable(optimised, visitMins, hLat, hLng);
      weekDays.push({
        dayName: di.dayName, dateLabel: di.label, dateKey: di.dateKey,
        slots: result.slots, backTime: result.backTime,
        hasDriveLeg: result.hasDriveLeg || false, blocked: false,
      });
      poolIdx++;
    }
    plan.push({ week: w + 1, days: weekDays });
  }
  return plan;
}

// ─────────────────────────────────────────────────────────────────────────────
// PARSING
// ─────────────────────────────────────────────────────────────────────────────
function dedupeStores(stores) {
  // Dedupe by base store code — compound codes like "AAA101:BBB102" and "BBB102" are the same store.
  // Extract the last segment after colon as the base code. Prefer compound (master) over simple.
  var byBaseCode = {};
  for (var i = 0; i < stores.length; i++) {
    var s = stores[i];
    var parts = s.code.split(":");
    var baseCode = parts[parts.length - 1].toUpperCase().trim();
    if (!byBaseCode[baseCode]) {
      byBaseCode[baseCode] = s;
    } else {
      // Prefer compound code (master record) over simple
      var existingIsCompound = byBaseCode[baseCode].code.indexOf(":") >= 0;
      var newIsCompound = s.code.indexOf(":") >= 0;
      if (newIsCompound && !existingIsCompound) {
        byBaseCode[baseCode] = s;
      }
    }
  }
  // Also dedupe by store id to catch any remaining duplicates
  var seenIds = {};
  var result = [];
  var vals = Object.values(byBaseCode);
  for (var j = 0; j < vals.length; j++) {
    if (!seenIds[vals[j].id]) {
      seenIds[vals[j].id] = true;
      result.push(vals[j]);
    }
  }
  return result;
}

function parseStoreList(text) {
  var lines = text.split("\n"), stores = [];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var parts = line.split(/[|,\t]/).map(function(p) { return p.trim(); });
    if (parts.length < 3 || !parts[2]) continue;
    var rawTier = (parts[3] || "C").toUpperCase().charAt(0);
    var tier = "ABCD".indexOf(rawTier) >= 0 ? rawTier : "C";
    stores.push({ id: "s"+i, code: parts[0]||("S"+i), name: parts[1]||("Store "+i), postcode: parts[2], tier: tier });
  }
  return dedupeStores(stores);
}

function loadXLSX() {
  return new Promise(function(res, rej) {
    if (window.XLSX) { res(window.XLSX); return; }
    var script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = function() { res(window.XLSX); };
    script.onerror = rej;
    document.head.appendChild(script);
  });
}

function parseUploadedFile(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onerror = reject;
    reader.onload = function(e) {
      if (!/\.xlsx?$/i.test(file.name)) { resolve(parseStoreList(e.target.result)); return; }
      loadXLSX().then(function(XLSX) {
        var wb = XLSX.read(e.target.result, { type: "binary" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
        var stores = [];
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          if (i === 0 && ["code","store","name","account"].indexOf(String(r[0]||"").toLowerCase()) >= 0) continue;
          var hasData = false;
          for (var ci = 0; ci < r.length; ci++) { if (r[ci] !== "") { hasData = true; break; } }
          if (!hasData) continue;
          var rawTier = String(r[3]||"C").toUpperCase().charAt(0);
          var tier = "ABCD".indexOf(rawTier) >= 0 ? rawTier : "C";
          var pc = String(r[2]||"").trim();
          if (!pc) continue;
          stores.push({ id:"s"+i, code:String(r[0]||("S"+i)).trim(), name:String(r[1]||("Store"+i)).trim(), postcode:pc, tier:tier });
        }
        resolve(dedupeStores(stores));
      }).catch(reject);
    };
    if (/\.xlsx?$/i.test(file.name)) reader.readAsBinaryString(file);
    else reader.readAsText(file);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// EXPORT — base64 data URI (works in sandboxed iframes)
// ─────────────────────────────────────────────────────────────────────────────
function exportToExcel(plan, repName, month) {
  return loadXLSX().then(function(XLSX) {
    var rows = [["Month","Week Number","Day","Store Code","Store Name","Postcode","Tier"]];
    for (var w = 0; w < plan.length; w++) {
      for (var d = 0; d < plan[w].days.length; d++) {
        var day = plan[w].days[d];
        if (day.blocked) continue;
        for (var i = 0; i < day.slots.length; i++) {
          var s = day.slots[i];
          rows.push([month, "Week "+plan[w].week, day.dateLabel||day.dayName, s.code, s.name, s.postcode, s.tier]);
        }
      }
    }
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:14},{wch:12},{wch:18},{wch:18},{wch:34},{wch:12},{wch:6}];
    XLSX.utils.book_append_sheet(wb, ws, "Journey Plan");
    var b64 = XLSX.write(wb, { bookType:"xlsx", type:"base64" });
    var filename = (repName||"Territory").replace(/[^a-z0-9]+/gi,"_")+"_"+(month||"Plan").replace(/[^a-z0-9]+/gi,"_")+"_Plan.xlsx";
    var a = document.createElement("a");
    a.href = "data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64;
    a.download = filename;
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function() { document.body.removeChild(a); }, 1000);
  });
}

function buildCopyText(plan, month) {
  var rows = [["Month","Week","Day","Store Code","Store Name","Postcode","Tier"].join("\t")];
  for (var w = 0; w < plan.length; w++) {
    for (var d = 0; d < plan[w].days.length; d++) {
      var day = plan[w].days[d];
      if (day.blocked) continue;
      for (var i = 0; i < day.slots.length; i++) {
        var s = day.slots[i];
        rows.push([month,"Week "+plan[w].week,day.dateLabel||day.dayName,s.code,s.name,s.postcode,s.tier].join("\t"));
      }
    }
  }
  return rows.join("\n");
}
